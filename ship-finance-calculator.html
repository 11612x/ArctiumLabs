  function serializeTranchePreset(t) {
    return {
      id: t.id,
      name: t.name,
      type: t.type,
      pct: t.pct,
      spread: t.spread,
      freq: t.freq,
      amortYears: t.amortYears,
      termYears: t.termYears,
      equityReturn: t.equityReturn,
    };
  }

  function serializeTermBlock(termEl) {
    const kind = termEl.dataset.kind;
    const base = {
      kind,
      termId: termEl.dataset.termId,
      collapsed: termEl.classList.contains('collapsed'),
    };
    if (kind === 'loan') {
      base.totalCapital = inputValue(termEl.querySelector('.term-total-capital'));
      base.tranches = readTranchesFromTerm(termEl).map(serializeTranchePreset);
    } else if (kind === 'refinancing') {
      base.marketValue = inputValue(termEl.querySelector('.term-market-value'));
      base.equityPct = inputValue(termEl.querySelector('.term-equity-pct'));
      base.sofr = inputValue(termEl.querySelector('.term-refi-sofr'));
      base.spread = inputValue(termEl.querySelector('.term-refi-spread'));
      base.equityReturn = inputValue(termEl.querySelector('.term-equity-return'));
      base.freq = termEl.querySelector('.term-refi-freq')?.value || 'quarterly';
      base.amortYears = inputValue(termEl.querySelector('.term-refi-amort'));
      base.termYears = inputValue(termEl.querySelector('.term-refi-term-years'));
      base.tranches = readTranchesFromTerm(termEl).map(serializeTranchePreset);
    } else if (kind === 'slb') {
      base.salePrice = inputValue(termEl.querySelector('.term-sale-price'));
      base.dailyLease = inputValue(termEl.querySelector('.term-daily-lease'));
      base.leaseYears = inputValue(termEl.querySelector('.term-lease-years'));
      base.buybackPrice = inputValue(termEl.querySelector('.term-buyback-price'));
    }
    return base;
  }

  function serializeShipFinanceState() {
    const vesselIds = [
      'vesselPrice', 'dailyTce', 'dailyOpex', 'vesselAge', 'usefulLife',
      'depreciationPct', 'sofrInput', 'residualValue',
    ];
    const vessel = {};
    vesselIds.forEach((id) => {
      const el = byId(id);
      if (el) vessel[id] = el.value;
    });
    vessel.residualMode = isAutoResidual() ? 'auto' : 'manual';
    return {
      version: 1,
      savedAt: Date.now(),
      sofrSource,
      activeTermId,
      vessel,
      terms: [...document.querySelectorAll('#termsContainer .term-block')].map(serializeTermBlock),
    };
  }

  function saveShipFinanceState() {
    if (stateRestoreActive) return;
    try {
      const state = serializeShipFinanceState();
      if (!state.terms.some((t) => t.kind === 'loan')) return;
      localStorage.setItem(SHIP_FINANCE_STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn('Could not save ship finance state', err);
    }
  }

  function scheduleSaveShipFinanceState() {
    if (stateRestoreActive) return;
    clearTimeout(saveStateTimer);
    saveStateTimer = setTimeout(saveShipFinanceState, 400);
  }

  function adoptTermId(el, termId) {
    if (!termId) return;
    el.dataset.termId = termId;
    const m = String(termId).match(/term-(\d+)/);
    if (m) termSeq = Math.max(termSeq, Number(m[1]));
  }

  function restoreTermBlock(term, index) {
    const n = index + 1;
    let el;
    if (term.kind === 'loan') {
      el = createLoanTermBlock(n);
      setInputValue(el.querySelector('.term-total-capital'), term.totalCapital);
    } else if (term.kind === 'refinancing') {
      el = createRefiTermBlock(n, {
        marketValue: num(term.marketValue),
        equityPct: num(term.equityPct, 40),
        sofr: num(term.sofr),
        spread: num(term.spread, 1.5),
        equityReturn: num(term.equityReturn, 6),
        freq: term.freq,
        amortYears: num(term.amortYears, 20),
        termYears: num(term.termYears, 7),
      });
      setInputValue(el.querySelector('.term-market-value'), term.marketValue);
      setInputValue(el.querySelector('.term-equity-pct'), term.equityPct);
      setInputValue(el.querySelector('.term-refi-sofr'), term.sofr);
      setInputValue(el.querySelector('.term-refi-spread'), term.spread);
      setInputValue(el.querySelector('.term-equity-return'), term.equityReturn);
      if (term.freq) {
        const freqEl = el.querySelector('.term-refi-freq');
        if (freqEl) freqEl.value = term.freq;
      }
      setInputValue(el.querySelector('.term-refi-amort'), term.amortYears);
      setInputValue(el.querySelector('.term-refi-term-years'), term.termYears);
    } else if (term.kind === 'slb') {
      el = createSlbTermBlock(n, {
        salePrice: num(term.salePrice),
        dailyLease: num(term.dailyLease),
        leaseYears: num(term.leaseYears, SLB_DEFAULTS.leaseYears),
        buybackPrice: num(term.buybackPrice),
      });
      setInputValue(el.querySelector('.term-sale-price'), term.salePrice);
      setInputValue(el.querySelector('.term-daily-lease'), term.dailyLease);
      setInputValue(el.querySelector('.term-lease-years'), term.leaseYears);
      setInputValue(el.querySelector('.term-buyback-price'), term.buybackPrice);
    } else {
      return null;
    }
    adoptTermId(el, term.termId);
    if (term.collapsed) el.classList.add('collapsed');
    (term.tranches || []).forEach((t) => addTrancheToTerm(el, t, { skipRecalc: true }));
    return el;
  }

  function loadShipFinanceState() {
    let raw;
    try {
      raw = localStorage.getItem(SHIP_FINANCE_STORAGE_KEY);
    } catch (_) {
      return false;
    }
    if (!raw) return false;
    let state;
    try {
      state = JSON.parse(raw);
    } catch (_) {
      return false;
    }
    if (!state?.terms?.length || !state.terms.some((t) => t.kind === 'loan')) return false;

    stateRestoreActive = true;
    try {
      const vessel = state.vessel || {};
      Object.keys(vessel).forEach((key) => {
        if (key === 'residualMode') return;
        setInputValue(byId(key), vessel[key]);
      });
      if (vessel.residualMode) setResidualMode(vessel.residualMode, true);
      if (state.sofrSource === 'live' || state.sofrSource === 'manual') sofrSource = state.sofrSource;

      const container = byId('termsContainer');
      if (!container) return false;
      container.innerHTML = '';
      state.terms.forEach((term, i) => {
        const el = restoreTermBlock(term, i);
        if (el) container.appendChild(el);
      });
      if (!container.querySelector('.term-block[data-kind="loan"]')) return false;

      activeTermId = state.activeTermId || null;
      document.querySelectorAll('#termsContainer .term-block').forEach((el) => {
        bindTermBlock(el);
        if (el.dataset.kind === 'loan' || el.dataset.kind === 'refinancing') {
          el.querySelectorAll('.tranche-card').forEach(bindTranche);
          installTrancheWatchdog(el);
          updateAllTrancheAmountDisplays(el);
        }
      });
      formatAllNumInputs(container);
      formatAllNumInputs(document);
      const active = activeTermId
        ? document.querySelector(`.term-block[data-term-id="${activeTermId}"]`)
        : null;
      setActiveTerm(active || container.querySelector('.term-block[data-kind="loan"]'), { scroll: false });
      return true;
    } catch (err) {
      console.warn('Could not restore ship finance state', err);
      return false;
    } finally {
      stateRestoreActive = false;
    }
  }

  function clearShipFinanceCalculator() {
    if (!window.confirm('Clear all terms, tranches, vessel inputs, and saved data? This cannot be undone.')) return;

    stateRestoreActive = true;
    clearTimeout(saveStateTimer);
    try {
      try {
        localStorage.removeItem(SHIP_FINANCE_STORAGE_KEY);
      } catch (_) { /* ignore */ }

      Object.entries(VESSEL_DEFAULTS).forEach(([id, value]) => setInputValue(byId(id), value));
      setResidualMode('auto', true);
      sofrSource = 'manual';
      termSeq = 0;
      trancheId = 0;
      activeTermId = null;

      const container = byId('termsContainer');
      if (container) container.innerHTML = '';

      bootstrapFinancingTerms();
      renumberTerms();
    } finally {
      stateRestoreActive = false;
    }

    fetchSofr();
    recalc();
    scheduleSaveShipFinanceState();
  }

  function bootstrapFinancingTerms() {
    const container = byId('termsContainer');
    if (!container) return null;

    let loanTerm = container.querySelector('.term-block[data-kind="loan"]');
    if (!loanTerm) {
      loanTerm = createLoanTermBlock(1);
      container.appendChild(loanTerm);
    }

    const capInput = loanTerm.querySelector('.term-total-capital');
    if (capInput) capInput.value = VESSEL_DEFAULTS.vesselPrice;

    if (!loanTerm.querySelector('.tranche-card')) {
      LOAN_TRANCHE_DEFAULTS.forEach((preset) => addTrancheToTerm(loanTerm, preset, { skipRecalc: stateRestoreActive }));
    } else {
      loanTerm.querySelectorAll('.tranche-card').forEach(bindTranche);
      updateAllTrancheAmountDisplays(loanTerm);
    }

    bindTermBlock(loanTerm);

    formatAllNumInputs(loanTerm);
    setActiveTerm(loanTerm, { scroll: false });
    installTrancheWatchdog(loanTerm);
    return loanTerm;
  }

  /**
   * Defensive watchdog: if anything ever wipes the loan term's tranches
   * (which is never a valid operation — only the user clicking the × on a
   * card can remove a single tranche), log a stack trace and restore the
   * cards from the cached snapshot.
   */
  function installTrancheWatchdog(termEl) {
    if (!termEl || termEl.dataset.watchdog === '1') return;
    const root = termEl.querySelector('.tranches-root');
    if (!root) return;
    termEl.dataset.watchdog = '1';
    const snapshot = () => Array.from(root.children).map((c) => c.cloneNode(true));
    let cached = snapshot();
    const refresh = () => { cached = snapshot(); };
    root.addEventListener('tranche-changed', refresh);
    const obs = new MutationObserver((muts) => {
      const removals = muts.flatMap((m) => Array.from(m.removedNodes))
        .filter((n) => n.nodeType === 1 && n.classList?.contains('tranche-card'));
      if (!removals.length) return;
      const remaining = root.querySelector('.tranche-card');
      if (!remaining && cached.length) {
        console.warn('[ship-finance] tranche wipe detected; restoring', new Error().stack);
        cached.forEach((c) => {
          const restored = c.cloneNode(true);
          root.appendChild(restored);
          bindTranche(restored);
        });
        recalc();
      } else {
        refresh();
      }
    });
    obs.observe(root, { childList: true });
  }

  function init() {
    document.querySelectorAll('.residual-mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => setResidualMode(btn.dataset.mode));
    });
    setResidualMode('auto', true);

    ['vesselPrice', 'dailyTce', 'dailyOpex', 'vesselAge', 'usefulLife', 'depreciationPct', 'sofrInput', 'residualValue'].forEach((id) => {
      const el = byId(id);
      if (!el) return;
      el.addEventListener('input', () => {
        if (programmaticSofrUpdate) return;
        if (el.classList.contains('num-fmt')) sanitizeNumInputEl(el);
        if (id === 'sofrInput') {
          sofrSource = 'manual';
          syncRefiSofrFromGlobal(el.value);
        }
        recalc();
        scheduleSaveShipFinanceState();
      });
      el.addEventListener('change', () => {
        recalc();
        scheduleSaveShipFinanceState();
      });
      el.addEventListener('blur', () => formatNumInputEl(el));
    });

    byId('addTrancheBtn')?.addEventListener('click', () => {
      const term = getActiveTermEl();
      if (!term || term.dataset.kind === 'slb') return;
      addTrancheToTerm(term, { name: 'Tranche', type: 'equity', pct: 0, equityReturn: 6 });
    });

    byId('addTermBtn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      byId('termAddWrap').classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#termAddWrap')) byId('termAddWrap').classList.remove('open');
    });

    document.querySelectorAll('.term-add-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const kind = btn.dataset.termKind;
        byId('termAddWrap').classList.remove('open');
        const prior = getEndOfPriorTermMetrics();
        const n = document.querySelectorAll('#termsContainer .term-block').length + 1;
        if (kind === 'refinancing') {
          const el = createRefiTermBlock(n, {
            marketValue: prior.vesselValue,
            sofr: num(byId('sofrInput').value),
          });
          appendTermBlock(el, { autogenRefi: true });
        } else if (kind === 'slb') {
          const el = createSlbTermBlock(n, { ...SLB_DEFAULTS });
          appendTermBlock(el);
        }
      });
    });

    byId('clearAllBtn')?.addEventListener('click', clearShipFinanceCalculator);
    byId('exportPdfBtn')?.addEventListener('click', exportPdf);

    termSeq = Math.max(termSeq, document.querySelectorAll('#termsContainer .term-block').length);
    const restored = loadShipFinanceState();
    if (!restored) bootstrapFinancingTerms();
    renumberTerms();

    if (!restored || sofrSource !== 'manual') fetchSofr();
    recalc();
    scheduleSaveShipFinanceState();

    if (window.parent !== window) {
      window.parent.postMessage({ type: 'arctium-ship-finance-ready' }, '*');
    }
  }

  try {
    init();
  } catch (err) {
    console.error('Ship finance init failed', err);
    const container = byId('termsContainer');
    if (container && !container.querySelector('.term-block')) {
      container.innerHTML = '<p style="padding:16px;color:var(--red);font-size:12px;">Calculator failed to load. Hard refresh (Cmd+Shift+R).</p>';
    }
  }
})();
</script>
